id: ai_security-20261110-3-de
version: F2
title: Zwei-Faktor zuerst fürs E-Mail-Konto
reihe: Fünf Minuten, die gefehlt haben
short: Zwei-Faktor fürs Postfach
note: Thema B02, rückwärts erzählt. Beispielfall nachgestellt; Folgen eines übernommenen Postfachs und Empfehlungen aus S1 (NCSC) und S2 (BSI), Faktenbasis aus dem Plan vom 01.11.2026.
description: Montagmorgen, das Firmenpostfach ist zu. Wir spulen zurück bis zu der Einstellung, die gefehlt hat. Fünf Minuten, die du heute erledigen kannst.
hashtags:
- zweifaktor
- emailsicherheit
- kmu
- itsicherheit
- fuenfminuten
sources:
- id: S1
  url: https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/use-a-strong-and-separate-password-for-email
  title: 'NCSC: Use a strong and separate password for your email'
  checked_at: '2026-11-01'
  label: NCSC, Passwort fürs E-Mail-Konto
- id: S2
  url: https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Accountschutz/Zwei-Faktor-Authentisierung/zwei-faktor-authentisierung_node.html
  title: 'BSI: Zwei-Faktor-Authentisierung'
  checked_at: '2026-11-01'
  label: BSI, Zwei-Faktor
unverified:
- 'Einzelne Anbieter und ihre Menüs: nicht genannt.'
- Ablauf im Beispielfall (Uhrzeiten, Passwort von einem anderen Dienst) ist erfunden und als Beispiel gekennzeichnet.
pick: demonstration
hooks:
- type: question
  spoken: Wer dein Firmenpostfach hat, was kann der alles? Mehr, als du denkst.
  screen: Was kann man mit deinem Postfach?
- type: misconception
  spoken: Ein gutes Passwort reicht fürs Postfach? Laut NCSC nicht ganz.
  screen: Gutes Passwort reicht?
  src:
  - S1
- type: surprising_fact
  spoken: Mit deinem Postfach lassen sich die Passwörter deiner anderen Konten zurücksetzen.
  screen: Ein Postfach, alle Schlüssel
  src:
  - S1
- type: concrete_risk
  spoken: Wer dein E-Mail-Konto hat, kann in deinem Namen schreiben.
  screen: Postfach weg, Name weg
  src:
  - S1
- type: demonstration
  spoken: Montag, sieben Uhr vierzig. Dein Firmenpostfach lässt dich nicht mehr rein.
  screen: MO 07:40 · Kein Zugriff
beats:
- f: hook
  t: sc_case
  s: 'Montag, sieben Uhr vierzig. Dein Firmenpostfach lässt dich nicht mehr rein. Auf dem Handy liegt eine Nachricht: Dein Passwort wurde geändert. Du warst das nicht.'
  d:
    kicker: Beispielfall · nachgestellt
    time: MO 07:40
    place: Inhaberin eines Malerbetriebs
    mail_at: '@Handy'
    mail:
      from: Mail-Anbieter (Beispiel)
      addr: no-reply@mail.example
      time: SO 23:14
      subject: Passwort geändert
      lines:
      - Für dein Konto wurde heute
      - ein neues Passwort festgelegt.
      - Warst du das nicht?
    highlight:
      line: 2
      label: nicht du
      at: '@warst'
- f: problem
  t: sc_inspect
  s: 'Was ist jetzt offen? Das britische NCSC zählt auf, was Kriminelle mit einem fremden Postfach tun können: private Daten lesen, auch Bankdaten. In deinem Namen schreiben. Und die Passwörter deiner anderen
    Konten zurücksetzen.'
  src:
  - S1
  d:
    kicker: Was jetzt offen ist
    headline: Ein Postfach, viele Türen
    rows:
    - label: Lesen
      value: Daten, auch Bankdaten
      verdict: möglich
      at: '@lesen'
    - label: Schreiben
      value: in deinem Namen
      verdict: möglich
      at: '@schreiben'
    - label: Zurücksetzen
      value: andere Passwörter
      verdict: möglich
      at: '@zurücksetzen'
    fact:
      kind: fakt
      text: Übers Postfach lassen sich andere Passwörter zurücksetzen.
      source: NCSC · Passwort fürs E-Mail-Konto
      at: '@Passwörter'
- f: demonstration
  t: sc_timeline
  s: 'Spulen wir zurück. Sonntagnacht meldet sich jemand mit deinem Passwort an. Du hattest es auch bei einem anderen Dienst benutzt. Genau hier hat etwas gefehlt: ein zweiter Faktor. Dann hätte ihm das
    Passwort allein nicht gereicht.'
  src:
  - S1
  - S2
  d:
    kicker: Zurückgespult
    tag: Beispiel
    headline: Wo es zu stoppen war
    items:
    - time: MO 07:40
      text: Kein Zugriff mehr
      tone: red
      at: 0.4
    - time: SO 23:14
      text: Anmeldung mit deinem Passwort
      tone: amber
      at: '@Sonntagnacht'
    - time: Vorher
      text: Gleiches Passwort woanders
      at: '@anderen'
    - time: Hier
      text: Kein zweiter Faktor
      at: '@zweiter'
    source:
      kind: fakt
      label: NCSC · zwei Schritte halten draußen
      at: '@Dann'
- f: insight
  t: sc_step
  s: 'Die Einstellung, die gefehlt hat: Bestätigung in zwei Schritten. Schalte sie heute in den Sicherheitseinstellungen deines Firmenpostfachs ein. Das NCSC rät dazu fürs E-Mail-Konto, plus ein eigenes
    Passwort, das es nur dort gibt. Das BSI rät: einschalten, sobald ein Dienst sie anbietet, und nicht wieder abschalten.'
  src:
  - S1
  - S2
  d:
    mode: rule
    kicker: Deine fünf Minuten
    card:
      letter: '2'
      title: Zwei-Faktor fürs Postfach
      sub: plus ein Passwort nur für dieses Konto
      at: 0.2
    sources:
    - kind: fakt
      label: NCSC · Bestätigung in zwei Schritten
    - kind: fakt
      label: BSI · nicht wieder abschalten
    sources_at: '@NCSC'
- f: close
  t: sc_close
  s: Erst das Postfach, dann der Rest. Das sind deine fünf Minuten für heute. Ist der zweite Faktor bei dir schon an? Schreib es in die Kommentare.
  d:
    kicker: Reihe · Fünf Minuten
    rule: Erst das Postfach sichern.
    rule_at: 0.3
    question:
      text: Schon eingeschaltet?
      at: '@Ist'
    domain: scutoria.com
    domain_at: 1.2
    claim: Belegt. Datiert. Vorzeigbar.
    disclaimer: Quellenbasiert. Keine Rechtsberatung.
