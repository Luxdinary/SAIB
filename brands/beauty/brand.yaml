    de: "KI-generiertes Video: synthetische Stimme, KI-Bilder und Animation. Erfundenes Produkt ohne Marke, kein Produkttest."
    en: "AI-generated video: synthetic voice, AI images and animation. Invented product without a brand, not a product test."
