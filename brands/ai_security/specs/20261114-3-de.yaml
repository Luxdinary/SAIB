id: ai_security-20261114-3-de
version: F2
title: "Ein Passwortmanager fürs Team"
short: "Passwortmanager fürs Team"
reihe: "Fünf Minuten, die gefehlt haben"
note: "F2 im Format \"Was tust du?\", rückwärts erzählt. Beispielfall nachgestellt: Betrieb, Portal, Uhrzeiten und Ablauf sind erfunden; Mechanik (ein geknacktes Passwort öffnet alle Konten, die es nutzen; über das Mailkonto lassen sich weitere Passwörter zurücksetzen) und Schritte aus S1 bis S3, am 02.11.2026 gelesen (S3 neu). Der alte Plan ai_security-20261114-3-de.json bleibt unverändert."
description: "Montagmorgen: Euer Passwort beim Großhändler wurde geändert, und ihr wart es nicht. Wir spulen zurück bis zur Entscheidung, die gefehlt hat. Ein nachgestellter Fall mit dem einen Schritt, den BSI und NCSC raten."
hashtags: [passwortmanager, passwort, kmu, itsicherheit, fuenfminuten]
sources:
  - {id: S1, url: "https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Accountschutz/Sichere-Passwoerter-erstellen/Passwort-Manager/passwort-manager_node.html", title: "BSI: Passwörter verwalten mit dem Passwort-Manager", checked_at: "2026-11-02", label: "BSI, Passwort-Manager"}
  - {id: S2, url: "https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers", title: "NCSC: Top tips for staying secure online – Managing your passwords", checked_at: "2026-11-02", label: "NCSC, Passwörter verwalten"}
  - {id: S3, url: "https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Publikationen/Broschueren/Wegweiser_Checklisten_Flyer/Checkliste_BSI_ProPK_Phishing.pdf?__blob=publicationFile&v=5", title: "BSI und Polizei (ProPK): Phishing – Checkliste für den Ernstfall (PDF)", checked_at: "2026-11-02", label: "BSI und Polizei, Checkliste"}
unverified:
  - "Einzelne Produkte: bewusst nicht genannt."
  - "Ablauf im Beispielfall (Großhändler-Portal, Sonntag 23:14, Passwort anderswo geknackt, Entscheidung vor Jahren) ist erfunden und als Beispiel gekennzeichnet."
  - "Neu am 02.11.2026 geprüft: S1 (über ein übernommenes Mailkonto lassen sich weitere Dienste per Passwort-Zurücksetzen übernehmen; zweiter Faktor für wichtige Konten wie E-Mail), S2 (zweiter Faktor auch für den Passwortmanager) und S3 (neues Passwort, alle aktiven Sitzungen beenden, weitere Konten prüfen; die Checkliste gilt für weitergegebene Zugangsdaten, hier auf ein übernommenes Konto übertragen)."
  - "NCSC nennt die Zwei-Schritt-Bestätigung als wichtigsten ersten Schritt; in diesem Video steht der Passwortmanager im Mittelpunkt, der zweite Faktor nur als Schutz des Managers."
pick: demonstration
hooks:
  - {type: question, spoken: "Wie viele Passwörter merkt sich dein Team, und wie viele davon sind gleich?", screen: "Wie viele Passwörter sind gleich?"}
  - {type: misconception, spoken: "Ein starkes Passwort für alles reicht? Laut BSI nicht.", screen: "Ein starkes Passwort für alles?", src: [S1]}
  - {type: surprising_fact, spoken: "Wer in dein Mailkonto kommt, kann laut BSI andere Passwörter zurücksetzen.", screen: "Mailkonto weg, alles weg", src: [S1]}
  - {type: concrete_risk, spoken: "Ein geknacktes Passwort, und die Täter kommen in jedes Konto, das es nutzt.", screen: "Ein Passwort, alle Konten offen", src: [S1, S2]}
  - {type: demonstration, spoken: "Montag, sieben Uhr fünfzig. Euer Passwort wurde geändert, und ihr wart es nicht.", screen: "MO 07:50 · Passwort geändert. Nicht von euch.", visual: "Uhrzeit groß, die Mail des Portals kommt als Papierkarte herein, die Zeile 'Das waren nicht Sie?' wird markiert"}
beats:
  - f: hook
    t: sc_case
    s: "Montag, sieben Uhr fünfzig. Mail vom Großhändler: Ihr Passwort wurde geändert. Ihr wart das nicht. Und dasselbe Passwort nutzt ihr auch fürs Mailkonto."
    d:
      kicker: "Beispielfall · nachgestellt"
      time: "MO 07:50"
      place: "Büro einer Gärtnerei"
      mail_at: "@Großhändler"
      mail: {from: "Gartenbedarf Beispiel", addr: "konto@gartenbedarf-beispiel.example", time: "07:50", subject: "Passwort geändert", lines: ["Ihr Passwort wurde am Sonntag", "um 23:14 Uhr geändert.", "Das waren nicht Sie?"]}
      highlight: {line: 2, label: "nicht ihr", at: "@nicht"}
  - f: problem
    t: sc_timeline
    s: "Spulen wir zurück. Sonntagabend meldet sich jemand mit eurem Passwort an. Vor Wochen wurde es woanders geknackt. Und vor Jahren habt ihr entschieden: ein starkes Passwort, für alle Konten. Laut BSI kommen Kriminelle dann in alle diese Konten."
    src: [S1]
    d:
      kicker: "Zurückgespult"
      tag: "Beispiel"
      headline: "Ein Passwort, viele Konten"
      items:
        - {time: "MO 07:50", text: "Portal-Passwort geändert", tone: red, at: 0.3}
        - {time: "SO 23:14", text: "Fremde Anmeldung", tone: amber, at: "@Sonntagabend"}
        - {time: "Vor Wochen", text: "Anderswo geknackt", tone: amber, at: "@Wochen"}
        - {time: "Vor Jahren", text: "Ein Passwort für alle Konten", tone: amber, at: "@Jahren"}
      source: {kind: fakt, label: "BSI · ein Passwort, alle Konten", at: "@BSI"}
  - f: explanation
    t: sc_choice
    s: "Was änderst du? A: Ein noch stärkeres Passwort, wieder für alle. B: Nur das Portal-Passwort ändern. C: Ein Passwortmanager, je Konto ein eigenes Passwort. Entscheide dich jetzt."
    src: [S1]
    d:
      question: "Was änderst du?"
      options:
        - {key: A, text: "Stärkeres Passwort, für alle", at: "@stärkeres"}
        - {key: B, text: "Nur das Portal-Passwort ändern", at: "@Portal"}
        - {key: C, text: "Passwortmanager, je Konto eigenes", at: "@Passwortmanager"}
      think: {seconds: 2.6, at: "@Entscheide"}
      hint: "Entscheide dich jetzt."
  - f: insight
    t: sc_step
    s: "Richtig ist C. Laut BSI ist für jeden Zugang ein eigenes, starkes Passwort am sichersten. Ein Passwortmanager merkt sie sich, geschützt durch ein Masterpasswort und einen zweiten Faktor. Fangt mit dem Mailkonto an. A und B lassen die übrigen Konten offen."
    src: [S1, S2]
    d:
      mode: rule
      kicker: "Der eine Schritt"
      card: {letter: C, title: "Passwortmanager fürs Team", sub: "je Konto eigenes, Mailkonto zuerst", at: 0.2}
      strikes:
        - {text: "A: Stärker, aber für alle", note: "ein Leck öffnet alle", at: "@lassen-0.6"}
        - {text: "B: Nur das Portal ändern", note: "Mailkonto bleibt offen", at: "@lassen"}
      sources:
        - {kind: fakt, label: "BSI · eigenes Passwort je Konto"}
        - {kind: fakt, label: "NCSC · Manager mit zweitem Faktor"}
      sources_at: "@BSI"
  - f: insight
    t: sc_step
    s: "Schon übernommen? Sofort ein neues Passwort vergeben und alle aktiven Sitzungen beenden. Dann prüfen, wo dasselbe Passwort noch steckt."
    src: [S3]
    d:
      mode: fallback
      kicker: "Schon passiert?"
      card: {letter: "!", title: "Sofort neu absichern", sub: "nicht abwarten", at: 0.2}
      steps:
        - {text: "Neues Passwort, Sitzungen beenden", at: "@neues"}
        - {text: "Gleiches Passwort? Überall ändern", at: "@prüfen"}
      sources:
        - {kind: fakt, label: "BSI und Polizei · Checkliste"}
      sources_at: "@sofort"
  - f: close
    t: sc_close
    s: "Jedes Konto ein eigenes Passwort: Das sind die fünf Minuten, die gefehlt haben. Was hättest du gewählt? Schreib es in die Kommentare."
    d:
      kicker: "Reihe · Fünf Minuten"
      rule: "Je Konto ein eigenes Passwort."
      rule_at: 0.3
      question: {text: "Was hättest du gewählt?", at: "@hättest"}
      domain: "scutoria.com"
      domain_at: 1.2
      claim: "Belegt. Datiert. Vorzeigbar."
      disclaimer: "Quellenbasiert. Keine Rechtsberatung."
