[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceless-network"
version = "0.1.0"
description = "Production chain for Stefan's AI short-video network (no publishing without APPROVED)"
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6",
  "python-dotenv>=1",
  "tzdata",
  "pillow>=10",
  "google-genai>=1",
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "requests>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
drafts = ["edge-tts"]

[project.scripts]
fn = "fn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
