id: ai_security-20261111-3-de
version: F2
title: 'Automatische Updates: einmal einschalten'
reihe: Fünf Minuten, die gefehlt haben
short: Automatische Updates
note: Thema B03. Beispielfall nachgestellt; Aussagen aus S1 (BSI) und S2 (NCSC), Faktenbasis aus dem Plan vom 01.11.2026.
description: Der Rechner will ein Update, du klickst auf später. Was tust du? Warum BSI und NCSC Updates zu den wirksamsten Schritten zählen und was du heute einschaltest.
hashtags:
- updates
- itsicherheit
- kmu
- fuenfminuten
- wastustdu
sources:
- id: S1
  url: https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Updates-Browser-Open-Source-Software/Wichtige-Softwareupdates/wichtige-softwareupdates_node.html
  title: 'BSI: Wichtige Softwareupdates'
  checked_at: '2026-11-01'
  label: BSI, Softwareupdates
- id: S2
  url: https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/install-the-latest-software-and-app-updates
  title: 'NCSC: Install the latest software and app updates'
  checked_at: '2026-11-01'
  label: NCSC, Updates installieren
unverified:
- 'Konkrete Menüpfade einzelner Systeme: nicht genannt.'
- Ablauf im Beispielfall (später geklickt, Schadprogramm über die Lücke) ist erfunden und als Beispiel gekennzeichnet; der Mechanismus stammt aus S1.
- Dass Updates einmal im Monat von Hand zu spät kommen können, ist Scutorias Auslegung, im Bild markiert.
pick: demonstration
hooks:
- type: question
  spoken: Wann hast du zuletzt ein Update auf später verschoben?
  screen: Schon wieder später?
- type: misconception
  spoken: 'Ein Update kann warten? Das BSI sagt: auf keinen Fall.'
  screen: Update kann warten?
  src:
  - S1
- type: surprising_fact
  spoken: Das BSI nennt Updates eines der wirksamsten Mittel gegen Angriffe aus dem Internet.
  screen: Eines der wirksamsten Mittel
  src:
  - S1
- type: concrete_risk
  spoken: Jede offene Lücke ist ein Weg für Schadprogramme in deinen Rechner.
  screen: Offene Lücke, offene Tür
  src:
  - S1
- type: demonstration
  spoken: Freitag, siebzehn Uhr zehn. Der Bürorechner will ein Update. Du klickst auf später.
  screen: FR 17:10 · Später?
beats:
- f: hook
  t: sc_case
  s: 'Freitag, siebzehn Uhr zehn. Der Bürorechner meldet: Sicherheitsupdate bereit, jetzt neu starten? Du klickst auf später. Wie letzte Woche.'
  d:
    kicker: Beispielfall · nachgestellt
    time: FR 17:10
    place: Büro eines Installateurbetriebs
    mail_at: '@Bürorechner'
    mail:
      from: Update-Hinweis (Beispiel)
      addr: System · Büro-PC
      time: '17:10'
      subject: Update bereit
      lines:
      - Ein Sicherheitsupdate ist bereit.
      - Jetzt neu starten?
      - '[ Später ]   [ Jetzt ]'
    highlight:
      line: 2
      label: später
      at: '@klickst'
- f: problem
  t: sc_inspect
  s: 'Was steckt in so einem Update? Laut BSI schließen Updates Sicherheitslücken. Das sind Schwachstellen, über die Angreifer etwa Schadprogramme einschleusen können. Und später installieren? Das BSI sagt:
    auf keinen Fall.'
  src:
  - S1
  d:
    kicker: Laut BSI
    headline: Was im Update steckt
    rows:
    - label: Inhalt
      value: schließt Lücken
      verdict: wichtig
      at: '@Sicherheitslücken'
    - label: Lücke
      value: Weg für Schadprogramme
      verdict: offen
      at: '@Schadprogramme'
    - label: Später
      value: auf keinen Fall
      verdict: BSI
      at: '@keinen'
    fact:
      kind: fakt
      text: Updates schließen Lücken, über die Schadprogramme kommen.
      source: BSI · Softwareupdates
      at: 1.4
- f: problem
  t: sc_choice
  s: 'Was tust du? A: Weiter auf später klicken. B: Updates einmal im Monat von Hand. C: Automatische Updates einschalten. Entscheide dich jetzt.'
  src:
  - S2
  d:
    question: Was tust du?
    options:
    - key: A
      text: Weiter auf später klicken
      at: '@Weiter'
    - key: B
      text: Einmal im Monat von Hand
      at: '@Monat'
    - key: C
      text: Automatische Updates einschalten
      at: '@Automatische'
    think:
      seconds: 2.6
      at: '@Entscheide'
    hint: Entscheide dich jetzt.
- f: demonstration
  t: sc_timeline
  s: Spielen wir A durch. Die Lücke bleibt offen, Tag für Tag. Ist sie bekannt, kann ein Angreifer sie nutzen und ein Schadprogramm einschleusen. Dabei lag das Update längst bereit.
  src:
  - S1
  d:
    kicker: Wahl A, durchgespielt
    tag: Beispiel
    headline: Die Lücke bleibt offen
    items:
    - time: FR 17:10
      text: Später geklickt
      at: 0.6
    - time: Tag für Tag
      text: Die Lücke bleibt offen
      tone: amber
      at: '@Tag'
    - time: Irgendwann
      text: Schadprogramm kommt rein
      tone: red
      at: '@Schadprogramm'
    - time: Dabei
      text: Das Update lag bereit
      at: '@Dabei'
    source:
      kind: fakt
      label: BSI · Lücken und Schadprogramme
      at: 1.0
- f: insight
  t: sc_step
  s: 'Richtig ist C: heute einschalten, auf Rechnern, Handys und im Browser. Das britische NCSC zählt Updates zu den wichtigsten und schnellsten Schritten und rät, automatische Updates einzuschalten. Aber
    Vorsicht: Laut BSI tarnen Kriminelle Schadsoftware auch als Update. Installier nur, was auf dem gewohnten Weg kommt.'
  src:
  - S1
  - S2
  d:
    mode: rule
    kicker: Der eine Schritt
    card:
      letter: C
      title: Automatisch aktualisieren
      sub: auf Rechnern, Handys, im Browser
      at: 0.2
    strikes:
    - text: 'A: Weiter später'
      note: Lücke bleibt offen
      at: 3.0
    - text: 'B: Einmal im Monat'
      note: oft zu spät
      at: 5.0
    sources:
    - kind: fakt
      label: NCSC · automatische Updates
    - kind: fakt
      label: BSI · falsche Updates
    - kind: auslegung
      label: 'B: Auslegung Scutoria'
    sources_at: '@NCSC'
- f: close
  t: sc_close
  s: Einmal einschalten, nicht mehr daran denken. Sind sie bei dir schon an? Schreib es in die Kommentare.
  d:
    kicker: Reihe · Fünf Minuten
    rule: Einmal einschalten.
    rule_at: 0.3
    question:
      text: Schon eingeschaltet?
      at: '@Sind'
    domain: scutoria.com
    domain_at: 1.2
    claim: Belegt. Datiert. Vorzeigbar.
    disclaimer: Quellenbasiert. Keine Rechtsberatung.
