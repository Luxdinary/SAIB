# Palette: light luxury editorial. Ivory ground from the Phase-1 draft kept; text, accent and muted darkened
# so that every text colour reaches WCAG 4.5:1 on ivory (draft: accent 2.4:1, muted 2.5:1, text 6.9:1).
# The draft rose #C98F93 stays as 'blush' for shapes and background clips only, never for text.
palette:
  bg: '#F8F3EF'            # ivory ground
  surface: '#FFFCF9'       # porcelain cards (text 11.8:1)
  text: '#4A2F34'          # deep mauve (10.9:1 on bg)
  muted: '#7E6468'         # secondary labels (4.9:1 on bg)
  accent: '#9B5560'        # deep rose: highlight word, lines, numbers (4.9:1 on bg)
  blush: '#C98F93'         # decorative only (drops, swirls, logo lane)
  hairline: '#E8D9D4'
  button: '#4A2F34'
  on_accent: '#F8F3EF'
  signal_amber: '#946420'  # honey: open questions, "Unsicher" (5.0:1 on surface, white text on it 5.1:1)
  on_signal: '#FFFFFF'
  signal_red: '#8E2F45'    # berry: the one stop at the end (7.8:1)
  signal_green: '#4F7A62'  # sage: only for "geregelt"
  paper: '#FFFFFF'         # the INCI label card (red thread)
  paper_ink: '#4A2F34'
  scheme: light
fonts:
  display:
    family: Playfair Display
    weight: 500
    file: assets/fonts/playfairdisplay/PlayfairDisplay[wght].ttf
    license: OFL-1.1
    license_file: assets/fonts/playfairdisplay/OFL.txt
  body:
    family: Inter
    weight: 400
    file: assets/fonts/inter/Inter[opsz,wght].ttf
    license: OFL-1.1
    license_file: assets/fonts/inter/OFL.txt
  mono:                    # no monospace in an editorial look: labels use Inter
    family: Inter
    weight: 500
    file: assets/fonts/inter/Inter[opsz,wght].ttf
    license: OFL-1.1
    license_file: assets/fonts/inter/OFL.txt
logo:
  file: brands/beauty/assets/logo/dewlane-mark.svg
  wordmark_text: DEWLANE     # text in Playfair Display, uppercase, letter-spacing 0.18em (renderer style for brand marks)
  logo_height_px: 40
  rules: drawn by Claude Code 2026-10-30, no third-party material; never recolour or add effects
motif: dew-drop
tempo: gentle
