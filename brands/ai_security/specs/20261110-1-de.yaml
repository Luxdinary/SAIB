id: ai_security-20261110-1-de
version: F2
title: Die Mail vom Chef, der dringend überweisen lässt
reihe: Was tust du?
short: Chef-Mail
note: Thema D01. Beispielfall nachgestellt; Mechanik und Empfehlungen aus S1 (Polizei Berlin) und S2 (FBI IC3), Faktenbasis aus dem Plan vom 01.11.2026.
description: 'Eine Mail im Namen deines Chefs: Übernahme, Überweisung ins Ausland, heute noch. Was tust du? Ein nachgestellter Fall und der eine Schritt, den die Polizei rät.'
hashtags:
- ceofraud
- chefbetrug
- buchhaltung
- kmu
- wastustdu
sources:
- id: S1
  url: https://www.berlin.de/polizei/aufgaben/praevention/betrug/artikel.693958.php
  title: 'Polizei Berlin: Geschäftsführer-Schwindel (CEO-Fraud)'
  checked_at: '2026-11-02'
  label: Polizei Berlin, CEO-Fraud
- id: S2
  url: https://www.ic3.gov/PSA/2024/PSA240911
  title: 'FBI IC3 PSA I-091124-PSA: Business Email Compromise (11.09.2024)'
  checked_at: '2026-11-02'
  label: FBI IC3, Warnung vom 11.09.2024
unverified:
- 'Schadenssummen für Deutschland oder Österreich: nicht verwendet.'
- Ablauf im Beispielfall (Uhrzeiten, Antwort des Täters, Gespräch am Montag) ist erfunden und als Beispiel gekennzeichnet.
pick: demonstration
hooks:
- type: question
  spoken: Dein Chef will per Mail eine dringende Überweisung ins Ausland. Was tust du?
  screen: Dringend überweisen. Was tust du?
- type: misconception
  spoken: Der Name stimmt, also ist es der Chef? Nicht unbedingt.
  screen: Name stimmt = Chef?
  src:
  - S1
- type: surprising_fact
  spoken: Ihr Wissen holen die Täter laut Polizei aus Handelsregister und Firmenwebsite.
  screen: Wissen aus dem Handelsregister
  src:
  - S1
- type: concrete_risk
  spoken: Eine Mail im Namen deines Chefs, und das Geld ist im Ausland.
  screen: Mail vom Chef?
  src:
  - S1
- type: demonstration
  spoken: Donnerstag, sechzehn Uhr achtundvierzig. Eine Mail von deinem Chef.
  screen: DO 16:48 · Mail vom Chef
beats:
- f: hook
  t: sc_case
  s: 'Donnerstag, sechzehn Uhr achtundvierzig. Eine Mail von deinem Chef: Wir übernehmen ein Unternehmen. Bitte heute noch eine größere Summe ins Ausland überweisen.'
  d:
    kicker: Beispielfall · nachgestellt
    time: DO 16:48
    place: Buchhaltung eines Elektrobetriebs
    mail_at: '@Mail'
    mail:
      from: Thomas Beispiel, Chef
      addr: t.beispiel@elektro.example
      time: '16:48'
      subject: 'Vertraulich: Übernahme'
      lines:
      - Wir übernehmen ein Unternehmen.
      - Bitte heute noch überweisen,
      - Konto im Anhang, Bank im Ausland.
    highlight:
      line: 2
      label: Ausland
      at: '@Ausland'
- f: problem
  t: sc_inspect
  s: 'Du schaust hin. Der Name: dein Chef. Das Thema: eine Übernahme, klingt plausibel. Das Konto: im Ausland, bei einer Übernahme denkbar. Laut Polizei holen sich Täter solches Wissen aus Handelsregister,
    Website und Geschäftsberichten.'
  src:
  - S1
  d:
    kicker: Was du prüfst
    headline: Klingt das echt?
    rows:
    - label: Absender
      value: Name des Chefs
      verdict: wirkt echt
      at: '@Name'
    - label: Thema
      value: Übernahme
      verdict: plausibel
      at: '@Thema'
    - label: Konto
      value: Bank im Ausland
      verdict: erklärbar
      at: '@Konto'
    finding:
      text: Alles klingt plausibel.
      at: '@denkbar'
    fact:
      kind: fakt
      text: Täter nutzen Handelsregister, Website und Geschäftsberichte.
      source: Polizei Berlin · CEO-Fraud
      at: '@Laut'
- f: problem
  t: sc_choice
  s: 'Was tust du? A: Du überweist, der Chef hat es eilig. B: Du antwortest auf die Mail und fragst nach. C: Du rufst deinen Chef unter seiner bekannten Nummer an. Entscheide dich jetzt.'
  src:
  - S1
  d:
    question: Was tust du?
    options:
    - key: A
      text: Sofort überweisen
      at: '@überweist'
    - key: B
      text: Auf die Mail antworten
      at: '@antwortest'
    - key: C
      text: Chef unter bekannter Nummer anrufen
      at: '@rufst'
    think:
      seconds: 2.6
      at: '@Entscheide'
    hint: Entscheide dich jetzt.
- f: demonstration
  t: sc_timeline
  s: 'Spielen wir B durch. Deine Rückfrage geht an die Adresse aus der Mail. Antworten kann also der Täter: Passt, bitte erledigen. Du überweist. Am Montag fragt dein Chef, wovon du redest.'
  src:
  - S1
  d:
    kicker: Wahl B, durchgespielt
    tag: Beispiel
    headline: Du fragst per Mail nach
    items:
    - time: DO 16:52
      text: Deine Rückfrage geht raus
      at: '@Rückfrage'
    - time: DO 17:03
      text: 'Antwort: Passt, bitte erledigen.'
      tone: amber
      at: '@Antworten'
    - time: DO 17:10
      text: Du überweist
      at: '@überweist'
    - time: MO 08:30
      text: Der Chef weiß von nichts
      tone: red
      at: '@Montag'
    source:
      kind: fakt
      label: Polizei Berlin · Absender prüfen
      at: 1.0
- f: insight
  t: sc_step
  s: 'Richtig ist C. Die Polizei rät: bei ungewöhnlichen Zahlungen die Absenderadresse prüfen und den Auftrag per Rückruf bestätigen lassen. Eine Antwort auf dieselbe Mail landet beim Absender.'
  src:
  - S1
  d:
    mode: rule
    kicker: Der eine Schritt
    card:
      letter: C
      title: Rückruf beim Chef
      sub: unter der Nummer, die ihr kennt
      at: 0.2
    strikes:
    - text: 'A: Sofort überweisen'
      note: keine Prüfung
      at: 3.0
    - text: 'B: Antwort auf die Mail'
      note: gleicher Absender
      at: '@Antwort'
    sources:
    - kind: fakt
      label: Polizei Berlin · Rückruf
    - kind: auslegung
      label: 'B: Auslegung Scutoria'
    sources_at: '@Polizei'
- f: insight
  t: sc_step
  s: Schon überwiesen? Dann sofort die Bank anrufen, einen Rückruf der Überweisung verlangen und Anzeige bei der Polizei erstatten.
  src:
  - S1
  - S2
  d:
    mode: fallback
    kicker: Schon überwiesen?
    card:
      letter: '!'
      title: Dann zählt Zeit
      sub: sofort handeln, nicht abwarten
      at: 0.2
    steps:
    - text: 'Bank: Überweisung zurückrufen'
      at: '@Bank'
    - text: Anzeige bei der Polizei
      at: '@Anzeige'
    sources:
    - kind: fakt
      label: Polizei Berlin · FBI IC3
    sources_at: '@sofort'
- f: close
  t: sc_close
  s: Erst zurückrufen, dann überweisen. Was hättest du gewählt? Schreib es in die Kommentare.
  d:
    kicker: Reihe · Was tust du?
    rule: Erst Rückruf, dann Zahlung.
    rule_at: 0.3
    question:
      text: Was hättest du gewählt?
      at: '@Was'
    domain: scutoria.com
    domain_at: 1.2
    claim: Belegt. Datiert. Vorzeigbar.
    disclaimer: Quellenbasiert. Keine Rechtsberatung.
