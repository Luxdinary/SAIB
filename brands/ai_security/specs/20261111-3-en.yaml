id: ai_security-20261111-3-en
version: F2
title: 'Automatic updates: switch them on once'
reihe: Fünf Minuten, die gefehlt haben
short: Automatische Updates EN
note: Topic B03, EN localisation. Example case staged; statements from S1 (BSI) and S2 (NCSC).
description: Your computer wants an update and you click later. What do you do? Why the NCSC and Germany's BSI count updates among the most effective steps, and what to switch on today.
hashtags:
- updates
- cybersecurity
- smallbusiness
- fiveminutes
- whatwouldyoudo
sources:
- id: S1
  url: https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Informationen-und-Empfehlungen/Cyber-Sicherheitsempfehlungen/Updates-Browser-Open-Source-Software/Wichtige-Softwareupdates/wichtige-softwareupdates_node.html
  title: 'BSI: Wichtige Softwareupdates'
  checked_at: '2026-11-01'
  label: BSI (German federal office), updates
- id: S2
  url: https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/install-the-latest-software-and-app-updates
  title: 'NCSC: Install the latest software and app updates'
  checked_at: '2026-11-01'
  label: NCSC, install updates
unverified:
- 'Menu paths of specific systems: not named.'
- The sequence of the example case (clicked later, malware through the gap) is invented and marked as an example; the mechanism comes from S1.
- That monthly manual updates can come too late is Scutoria's reading, marked on screen.
pick: demonstration
hooks:
- type: question
  spoken: When did you last put off an update until later?
  screen: Later, again?
- type: misconception
  spoken: 'An update can wait? Germany''s BSI says: absolutely not.'
  screen: Updates can wait?
  src:
  - S1
- type: surprising_fact
  spoken: The BSI calls updates one of the most effective defences against online attacks.
  screen: One of the most effective defences
  src:
  - S1
- type: concrete_risk
  spoken: Every open gap is a way for malware into your computer.
  screen: Open gap, open door
  src:
  - S1
- type: demonstration
  spoken: Friday, 5:10 p.m. The office computer wants an update. You click later.
  screen: FRI 17:10 · Later?
beats:
- f: hook
  t: sc_case
  s: 'Friday, 5:10 p.m. The office computer says: Security update ready, restart now? You click later. Same as last week.'
  d:
    kicker: Example case · staged
    time: FRI 17:10
    place: Office of a plumbing firm
    mail_at: '@office'
    mail:
      from: Update notice (example)
      addr: System · office PC
      time: '17:10'
      subject: Update ready
      lines:
      - A security update is ready.
      - Restart now?
      - '[ Later ]   [ Now ]'
    highlight:
      line: 2
      label: later
      at: '@click'
- f: problem
  t: sc_inspect
  s: 'What''s inside an update like that? According to Germany''s BSI, updates close security gaps. Those are weaknesses attackers can use, for example to sneak in malware. And installing later? The BSI
    says: absolutely not.'
  src:
  - S1
  d:
    kicker: According to the BSI
    headline: What's in the update
    rows:
    - label: Content
      value: closes gaps
      verdict: important
      at: '@gaps'
    - label: Gap
      value: a way in for malware
      verdict: open
      at: '@malware'
    - label: Later
      value: absolutely not
      verdict: BSI
      at: '@absolutely'
    fact:
      kind: fakt
      text: Updates close the gaps that malware comes through.
      source: BSI · software updates
      at: 1.4
- f: problem
  t: sc_choice
  s: 'What do you do? A: Keep clicking later. B: Update by hand once a month. C: Switch on automatic updates. Remember your choice.'
  src:
  - S2
  d:
    question: What do you do?
    options:
    - key: A
      text: Keep clicking later
      at: '@Keep'
    - key: B
      text: By hand, once a month
      at: '@month'
    - key: C
      text: Switch on automatic updates
      at: '@Switch'
    think:
      seconds: 2.6
      at: '@Remember'
    hint: Remember your choice.
- f: demonstration
  t: sc_timeline
  s: Let's play out A. The gap stays open, day after day. If it's known, an attacker can use it to get malware in. And all the while, the update was sitting there, ready.
  src:
  - S1
  d:
    kicker: Choice A, played out
    tag: Example
    headline: The gap stays open
    items:
    - time: FRI 17:10
      text: Clicked later
      at: 0.6
    - time: Day after day
      text: The gap stays open
      tone: amber
      at: '@day'
    - time: Some day
      text: Malware gets in
      tone: red
      at: '@malware'
    - time: All the while
      text: The update was ready
      at: '@while'
    source:
      kind: fakt
      label: BSI · gaps and malware
      at: 1.0
- f: insight
  t: sc_step
  s: 'The right answer is C: switch it on today, on computers, phones and browsers. The UK''s NCSC counts updates among the most important and quickest steps, and advises switching on automatic updates.
    But careful: the BSI warns that criminals also disguise malware as updates. Only install what arrives the usual way.'
  src:
  - S1
  - S2
  d:
    mode: rule
    kicker: The one step
    card:
      letter: C
      title: Update automatically
      sub: on computers, phones, browsers
      at: 0.2
    strikes:
    - text: 'A: Keep clicking later'
      note: gap stays open
      at: 3.0
    - text: 'B: Once a month by hand'
      note: often too late
      at: 5.0
    sources:
    - kind: fakt
      label: NCSC · automatic updates
    - kind: fakt
      label: BSI · fake updates
    - kind: auslegung
      label: 'B: Scutoria''s reading'
    sources_at: '@NCSC'
- f: close
  t: sc_close
  s: Switch it on once, then stop thinking about it. Are yours on already? Tell me in the comments.
  d:
    kicker: Series · Five minutes
    rule: Switch it on once.
    rule_at: 0.3
    question:
      text: Already switched on?
      at: '@Are'
    domain: scutoria.com
    domain_at: 1.2
    claim: Sourced. Dated. Ready to show.
    disclaimer: Source-based. No legal advice.
