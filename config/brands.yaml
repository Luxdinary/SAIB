# Brand registry. brand_id is stable. Display names decided by Stefan on 2026-10-30
# after the name research (OneDrive\Business\02 Marke\Namensrecherche 2026-10-29.md).
# enabled: false = configured and designed, not producing or publishing.
# Decisions by Stefan, 2026-10-29: one account per brand, DE and EN on the same account,
# slots 12:00 / 14:00 / 18:00 Europe/Vienna, automatic approval unless risk_level is high.

defaults:
  languages: [de, en]
  primary_language: de
  platforms: [tiktok, instagram, youtube]
  timezone: Europe/Vienna
  slots: ["12:00", "18:00"]
  # Stefan, 03.11.2026, 20:45: 2 topics per brand and day, each in German and English (4 videos), 7 days a week. One topic = DE/EN twin.
  # Slots (Europe/Vienna) confirmed by Stefan on 03.11.2026 ("Passen"): topic 1 DE 12:00, EN 15:00; topic 2 DE 18:00, EN 21:00.
  # Until 03.11.2026 the grid was 6 posts per day (DE 12:00/14:00/18:00, EN 15:00/20:00/23:00, topics_per_day 3); the calendars
  # data/calendars/<id>_2026-11.json (09.11. to 06.12.) still follow that grid. The month plan (<id>_2026-11.plan.json) follows this one.
  slots_by_language:
    de: ["12:00", "18:00"]
    en: ["15:00", "21:00"]
  topics_per_day: 2
  video:
    width: 1080
    height: 1920
    min_seconds: 65
    max_seconds: 90
    hard_min_seconds: 61
  approval:
    mode: automatic            # automatic | manual
    manual_first_n: 20         # Claude's recommendation: calibrate the first 20 per brand by hand
    human_review_risk: [high]
  ai_disclosure: always        # label every video on every platform
  buffer_days: 7

brands:
  - id: claude_workflows
    name: Promptwerk             # decided 2026-10-30 (name research in OneDrive\Business\02 Marke)
    niche: Claude workflows and prompts
    phase: 2
    enabled: true
    style: clean_saas
    palette: {bg: "#171923", accent: "#A78BFA", text: "#F8FAFC"}
    rules:
      - no screen recordings; UI scenes are labelled animations (Stefan, 2026-10-30); no private data
      - every workflow must match the Anthropic docs; say "tested" only if it actually ran (note the Claude Code version)
    risk_default: low
    brand_version: "1.0"         # Vorlage freigegeben von Stefan am 01.11.2026 (Testvideo der Qualitaetsrunde)
    template_doc: 'C:\Users\Stefa\OneDrive\Business\02 Marke\Promptwerk\Vorlage Promptwerk.md'

  - id: ai_security
    name: Scutoria               # Stefan's existing brand; align with OneDrive\scutoria\CLAUDE.md
    niche: AI and security for small businesses
    phase: 2
    enabled: true
    style: scutoria_brand
    brand_version: "1.0"         # Vorlage Fassung B, decided by Stefan 2026-10-30
    template_doc: 'C:\Users\Stefa\OneDrive\Business\02 Marke\Scutoria\Vorlage Scutoria (Fassung B).md'
    palette: {bg: "#0b1120", accent: "#4f8cff", text: "#e9eef8"}   # Scutoria tokens.json (ground, accent, ink); full set in brands/ai_security/brand.yaml
