id: ai_security-20261115-2-en
version: F2
title: "Myth: the padlock means the site is legit"
short: "Mythos Schloss-Symbol EN"
reihe: "Was tust du?"
note: "F2 EN (localised from the DE spec), the myth as wrong option A. Example case staged: bank, firm, address, times and sequence are invented; the address follows the pattern of the BSI example (bank name with unusual characters in front). Mechanism and steps from S1 to S3, read 02.11.2026 (S3 new). The old plan ai_security-20261115-2-en.json stays unchanged."
description: "Your bank's login page, padlock at the top. So it's genuine? A staged case with three answers and what the Chrome team and Germany's BSI say about the padlock."
hashtags: [phishing, https, myth, browser, whatwouldyoudo]
sources:
  - {id: S1, url: "https://blog.chromium.org/2023/05/an-update-on-lock-icon.html", title: "Chromium Blog: An Update on the Lock Icon (02.05.2023)", checked_at: "2026-11-02", label: "Chromium blog, lock icon"}
  - {id: S2, url: "https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Cyber-Sicherheitslage/Methoden-der-Cyber-Kriminalitaet/Spam-Phishing-Co/Passwortdiebstahl-durch-Phishing/Wie-erkenne-ich-Phishing-in-E-Mails-und-auf-Webseiten/wie-erkenne-ich-phishing-in-e-mails-und-auf-webseiten_node.html", title: "BSI: Wie erkenne ich Phishing in E-Mails und auf Webseiten?", checked_at: "2026-11-02", label: "BSI (Germany), spotting phishing"}
  - {id: S3, url: "https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Publikationen/Broschueren/Wegweiser_Checklisten_Flyer/Checkliste_BSI_ProPK_Phishing.pdf?__blob=publicationFile&v=5", title: "BSI und Polizei (ProPK): Phishing – Checkliste für den Ernstfall (PDF)", checked_at: "2026-11-02", label: "BSI and German police, phishing checklist"}
unverified:
  - "How other browsers display it: not claimed."
  - "The figure from the 2021 Chrome study (11 percent) is not used in this version."
  - "The sequence of the example case (Example Bank, the address 135x-examplebank.example, direct debit, code request, times) is invented and marked as an example."
  - "The BSI speaks of a TAN (transaction number); localised as 'one-time code for a payment'."
  - "Fallback localised: the German blocking hotline 116 116 from S3 is replaced by 'call your bank', which S3 also names."
  - "Newly checked 02.11.2026: S2 (a TAN request without a transaction of your own is a clear sign of a fake page) and S3 (criminals harvest passwords on fake pages; contact your bank and check transactions)."
pick: demonstration
hooks:
  - {type: misconception, spoken: "The padlock in your browser means the site is genuine? That's exactly what's wrong.", screen: "Padlock = genuine site?", src: [S1]}
  - {type: question, spoken: "What exactly does the little padlock in the address bar tell you?", screen: "What does the padlock tell you?"}
  - {type: surprising_fact, spoken: "According to the Chrome team, nearly all phishing sites show the padlock too.", screen: "Phishing sites with a padlock", src: [S1]}
  - {type: concrete_risk, spoken: "One fake login page with a padlock, and your login details are gone.", screen: "Padlock there, details gone", src: [S1, S3]}
  - {type: demonstration, spoken: "Wednesday, 4:40 p.m. Your bank's login page, with the padlock at the top.", screen: "WED 16:40 · Login with a padlock", visual: "clock, the login page arrives as a paper card, the padlock line is marked"}
beats:
  - f: hook
    t: sc_case
    s: "Wednesday, 4:40 p.m. A link in an email opens your bank's login page. In the address bar: the padlock."
    d:
      kicker: "Example case · staged"
      time: "WED 16:40"
      place: "Accounts desk, café"
      mail_at: "@login"
      mail: {from: "Login · Example Bank", addr: "https://135x-examplebank.example", time: "16:40", subject: "Online banking sign-in", lines: ["Please sign in", "to review a direct debit.", "Connection: secure (padlock)"]}
      highlight: {line: 2, label: "padlock", at: "@address"}
  - f: problem
    t: sc_inspect
    s: "You check. The padlock: there. The address: starts with https. The design: as always. Looks secure. But according to the Chrome team, nearly all phishing sites show the padlock too."
    src: [S1]
    d:
      kicker: "What you check"
      headline: "All secure?"
      rows:
        - {label: "Padlock", value: "there", verdict: "looks fine", at: "@padlock"}
        - {label: "Address", value: "starts with https", verdict: "looks fine", at: "@address"}
        - {label: "Design", value: "as always", verdict: "looks fine", at: "@design"}
      finding: {text: "Looks secure.", at: "@Looks"}
      fact: {kind: fakt, text: "Nearly all phishing sites show the padlock too.", source: "Chromium blog · 2 May 2023", at: "@according"}
  - f: problem
    t: sc_choice
    s: "What do you do? A: The padlock is there, so you sign in. B: You check the certificate: valid. C: You read the address, character by character. Remember your choice."
    src: [S1, S2]
    d:
      question: "What do you do?"
      options:
        - {key: A, text: "Padlock's there, so sign in", at: "@sign"}
        - {key: B, text: "Click it: certificate is valid", at: "@certificate"}
        - {key: C, text: "Read every character of the address", at: "@read"}
      think: {seconds: 2.6, at: "@Remember"}
      hint: "Remember your choice."
  - f: demonstration
    t: sc_timeline
    s: "Let's play out A. You sign in. Then the page asks for a one-time code for a payment you never made. According to the BSI, that's a clear sign of a fake, and your login details are already gone."
    src: [S2, S3]
    d:
      kicker: "Choice A, played out"
      tag: "Example"
      headline: "Padlock there, you sign in"
      items:
        - {time: "WED 16:41", text: "You sign in", at: "@sign"}
        - {time: "WED 16:42", text: "Page wants a payment code", tone: amber, at: "@one-time"}
        - {time: "Afterwards", text: "Login details with criminals", tone: red, at: "@login"}
      source: {kind: fakt, label: "BSI · code without payment = fake", at: "@BSI"}
  - f: insight
    t: sc_step
    s: "The right answer is C. Germany's BSI advises checking every link before you open it. Be suspicious of the bank's name with unusual numbers in front. On A: the padlock only shows an encrypted connection. On B: scammers get certificates too."
    src: [S1, S2]
    d:
      mode: rule
      kicker: "The one step"
      card: {letter: C, title: "Read the address", sub: "bank name plus odd characters? Stop.", at: 0.2}
      strikes:
        - {text: "A: Padlock, so it's genuine", note: "only encrypted", at: "@padlock"}
        - {text: "B: Certificate is valid", note: "scammers have them too", at: "@scammers"}
      sources:
        - {kind: fakt, label: "BSI · check links before opening"}
        - {kind: fakt, label: "Chromium · padlock isn't trust"}
      sources_at: "@BSI"
  - f: insight
    t: sc_step
    s: "Already signed in? Then call your bank straight away to block access, and check your transactions with them."
    src: [S3]
    d:
      mode: fallback
      kicker: "Already signed in?"
      card: {letter: "!", title: "Block access now", sub: "don't wait", at: 0.2}
      steps:
        - {text: "Call your bank, block access", at: "@call"}
        - {text: "Check transactions with them", at: "@check"}
      sources:
        - {kind: fakt, label: "BSI and police · phishing checklist"}
      sources_at: "@straight"
  - f: close
    t: sc_close
    s: "Encrypted doesn't mean genuine. Read the address. What would you have picked? Tell me in the comments."
    d:
      kicker: "Series · What would you do?"
      rule: "Encrypted doesn't mean genuine."
      rule_at: 0.3
      question: {text: "What would you have picked?", at: "@What"}
      domain: "scutoria.com"
      domain_at: 1.2
      claim: "Sourced. Dated. Ready to show."
      disclaimer: "Source-based. No legal advice."
