<!doctype html>
<html lang="de" data-resolution="portrait"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<title>bg_drop_ripple</title><script src="assets/vendor/gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;}html,body{width:1080px;height:1920px;overflow:hidden;background:#F8F3EF;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;}#ground{position:absolute;inset:0;background:#F8F3EF;background-image:radial-gradient(ellipse at 15% 10%,rgba(201,143,147,0.20) 0,transparent 42%),radial-gradient(ellipse at 90% 85%,rgba(201,143,147,0.22) 0,transparent 45%);}
#art{position:absolute;inset:0;}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16.0" data-width="1080" data-height="1920" data-fps="30">
<div id="ground"></div><div id="art" class="clip" data-start="0" data-duration="16.0" data-track-index="1">
<svg viewBox="0 0 1080 1920" width="1080" height="1920" style="position:absolute;inset:0">
<defs>
  <radialGradient id="dropfill" cx="40%" cy="55%" r="65%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#C98F93" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#9B5560" stop-opacity="0.45"/>
  </radialGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.6" stop-color="#F3E3DF"/>
    <stop offset="1" stop-color="#E6C9C4"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
    <stop offset="0.5" stop-color="#F1E2DE" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#E2C3BF" stop-opacity="0.8"/>
  </linearGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D9B8B3"/><stop offset="0.5" stop-color="#C98F93"/><stop offset="1" stop-color="#A86C73"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#9B5560" flood-opacity="0.18"/></filter>
</defs>
  <ellipse cx="540" cy="1760" rx="760" ry="230" fill="url(#cream)" opacity="0.9" filter="url(#soft)"/>
  <g id="rings" transform="translate(540 1690)">
    <ellipse class="ring" rx="60" ry="14" fill="none" stroke="#C98F93" stroke-width="3"/>
    <ellipse class="ring" rx="60" ry="14" fill="none" stroke="#C98F93" stroke-width="3"/>
    <ellipse class="ring" rx="60" ry="14" fill="none" stroke="#C98F93" stroke-width="3"/>
  </g>
  <g id="drop" transform="translate(830 250)" filter="url(#shadow)"><path d="M0 -150 C-30 -95 -110 -10 -110 60 A110 110 0 0 0 110 60 C110 -10 30 -95 0 -150 Z" fill="url(#dropfill)"/>
    <path d="M-60 60 A62 62 0 0 0 -8 118" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.9"/></g>
  <g id="drop2" transform="translate(190 420) scale(0.38)" opacity="0.7"><path d="M0 -150 C-30 -95 -110 -10 -110 60 A110 110 0 0 0 110 60 C110 -10 30 -95 0 -150 Z" fill="url(#dropfill)"/></g>
</svg></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#ground",{scale:1.0,transformOrigin:"50% 50%"},{scale:1.06,duration:16.0,ease:"none"},0);

tl.fromTo("#drop",{attr:{transform:"translate(830 250)"}},{attr:{transform:"translate(830 420)"},duration:16,ease:"sine.inOut"},0);
tl.fromTo("#drop2",{attr:{transform:"translate(190 420) scale(0.38)"}},{attr:{transform:"translate(210 540) scale(0.38)"},duration:16,ease:"sine.inOut"},0);
document.querySelectorAll("#rings .ring").forEach((r,i)=>{
  for(let k=0;k<4;k++){ const t=i*1.3+k*4.0; if(t<15.5) tl.fromTo(r,{attr:{rx:40,ry:9},opacity:0.9},{attr:{rx:620,ry:120},opacity:0,duration:3.8,ease:"power1.out"},t); }
});

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script></body></html>
