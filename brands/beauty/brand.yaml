explainer:                         # Schnitt- und Layout-Vorlage (Stefan, 30.10.2026), Hochformat; fn.render.explainer
  enabled: true
  voice_tag: {de: "SYNTHETISCHE STIMME", en: "SYNTHETIC VOICE"}
  opening: {de: "Synthetische Stimme · Quellen am Bildschirm · Keine medizinische Beratung", en: "Synthetic voice · Sources on screen · Not medical advice"}
  opening_seconds: 3.5
  source_y: 1112                   # scene zone ends 1100, two-line captions start ~1250, status bar 1440, platform text from 1600
  # fixed meaning, tuned to the light palette: fakt = accent (deep rose, also the in-scene fact squares),
  # unsicher = honey (signal_amber), luecke = berry (signal_red, also the in-scene gap circles), auslegung = violet
  colors: {fakt: "#9B5560", auslegung: "#7A5AC8", unsicher: "#946420", luecke: "#8E2F45", beispiel: "#8a93a6"}
  vignette_color: "rgba(74,47,52,0.10)"   # Q1: soft mauve edge shade for the hook close-up; stronger tints push the voice tag and AI label under WCAG AA
