id: ai_security-20261112-3-de
version: F2
title: Die Daten-Ampel für KI-Tools
reihe: Vor dem Upload
short: Daten-Ampel
note: Thema E06. Keine Rechtsberatung. Beispielfall nachgestellt; Aussagen aus S1 (DSK-Orientierungshilfe KI) und S2 (BSI), Faktenbasis aus dem Plan vom 01.11.2026. Die Ampel ist eine Scutoria-Einordnung.
description: Deine Kollegin will ein Arbeitszeugnis von der KI glätten lassen, ohne Namen. Reicht das? Was die Datenschutzkonferenz sagt und eine Ampel fürs Team.
hashtags:
- datenschutz
- kiimbuero
- dsgvo
- kmu
- vordemupload
sources:
- id: S1
  url: https://www.datenschutzkonferenz-online.de/media/oh/20240506_DSK_Orientierungshilfe_KI_und_Datenschutz.pdf
  title: 'DSK: Orientierungshilfe Künstliche Intelligenz und Datenschutz (06.05.2024)'
  checked_at: '2026-11-01'
  label: DSK, Orientierungshilfe KI
- id: S2
  url: https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/KI/Generative_KI-Modelle.html
  title: 'BSI: Generative KI-Modelle – Chancen und Risiken'
  checked_at: '2026-11-01'
  label: BSI, Generative KI
unverified:
- Die Ampel selbst ist eine Scutoria-Einordnung, keine Vorgabe der DSK; im Bild als Auslegung markiert.
- Keine Rechtsberatung zu Rechtsgrundlagen im Einzelfall.
- Ablauf im Beispielfall (Kollegin, privates KI-Konto) ist erfunden; das Zeugnis-Beispiel stammt aus S1.
pick: demonstration
hooks:
- type: question
  spoken: Darf das in den KI-Chat? Eine einfache Ampel entscheidet es in Sekunden.
  screen: Darf das in den KI-Chat?
- type: misconception
  spoken: Namen gelöscht, also anonym? Laut Datenschutzkonferenz oft nicht.
  screen: Namen weg = anonym?
  src:
  - S1
- type: surprising_fact
  spoken: Für berufliche KI-Nutzung sollen Arbeitgeber eigene Konten stellen.
  screen: Firmenkonto statt Privatkonto
  src:
  - S1
- type: concrete_risk
  spoken: Ein Zeugnis ohne Namen, und trotzdem weiß jeder, wer gemeint ist.
  screen: Ohne Namen, trotzdem erkennbar
  src:
  - S1
- type: demonstration
  spoken: Donnerstag, vierzehn Uhr. Ein Arbeitszeugnis soll in den KI-Chat.
  screen: DO 14:00 · Zeugnis in den KI-Chat?
beats:
- f: hook
  t: sc_case
  s: Donnerstag, vierzehn Uhr. Deine Kollegin will ein Arbeitszeugnis von einer KI glätten lassen. Die Namen hat sie vorher gelöscht.
  d:
    kicker: Beispielfall · nachgestellt
    time: DO 14:00
    place: Personalbüro eines Autohauses
    mail_at: '@Kollegin'
    mail:
      from: KI-Chat (Beispiel)
      addr: privates Konto
      time: '14:00'
      subject: Zeugnis freundlicher machen
      lines:
      - 'Bitte formuliere das freundlicher:'
      - Kundenberater, Autohaus Beispiel,
      - drei Jahre, Abteilung Neuwagen.
    highlight:
      line: 1
      label: erkennbar
      at: '@Namen'
- f: problem
  t: sc_inspect
  s: 'Sie hat aufgepasst: Name weg, Adresse weg. Aber die Datenschutzkonferenz der deutschen Aufsichtsbehörden sagt: Der Personenbezug kann sich aus dem Zusammenhang ergeben. Ihr Beispiel: ein Arbeitszeugnis
    für einen Kundenberater in einem bestimmten Autohaus.'
  src:
  - S1
  d:
    kicker: Was du prüfst
    headline: Ist das anonym?
    rows:
    - label: Name
      value: gelöscht
      verdict: erledigt
      at: '@Name'
    - label: Adresse
      value: gelöscht
      verdict: erledigt
      at: '@Adresse'
    - label: Kontext
      value: Stelle, Autohaus
      verdict: erkennbar
      at: '@Zusammenhang'
    fact:
      kind: fakt
      text: Personenbezug kann sich aus dem Zusammenhang ergeben.
      source: DSK · Orientierungshilfe KI
      at: '@Beispiel'
- f: problem
  t: sc_choice
  s: 'Was tust du? A: Passt, die Namen sind ja weg. B: Sie nimmt ihr privates KI-Konto, das ist ihre Sache. C: Ihr klärt erst, ob das überhaupt rein darf. Entscheide dich jetzt.'
  src:
  - S1
  d:
    question: Was tust du?
    options:
    - key: A
      text: Passt, die Namen sind weg
      at: '@Passt'
    - key: B
      text: Privates KI-Konto nehmen
      at: '@privates'
    - key: C
      text: Erst klären, dann hochladen
      at: '@klärt'
    think:
      seconds: 2.4
      at: '@Entscheide'
    hint: Entscheide dich jetzt.
- f: insight
  t: sc_step
  s: 'Richtig ist C. Die Datenschutzkonferenz sagt: Wer personenbezogene Daten in KI-Anwendungen verarbeitet, braucht dafür eine Rechtsgrundlage. Und Arbeitgeber sollen für die berufliche KI-Nutzung eigene
    Geräte und Konten stellen. A übersieht den Zusammenhang, B das Firmenkonto.'
  src:
  - S1
  d:
    mode: rule
    kicker: Der eine Schritt
    card:
      letter: C
      title: Erst klären, dann hochladen
      sub: 'bei Personendaten: Rechtsgrundlage'
      at: 0.2
    strikes:
    - text: 'A: Namen sind ja weg'
      note: Kontext zählt
      at: '@übersieht'
    - text: 'B: Privates KI-Konto'
      note: Firmenkonto stellen
      at: '@Firmenkonto'
    sources:
    - kind: fakt
      label: DSK · Rechtsgrundlage
    - kind: fakt
      label: DSK · eigene Geräte und Konten
    sources_at: '@Rechtsgrundlage'
- f: benefit
  t: sc_step
  s: 'Daraus lässt sich eine Ampel fürs Team bauen. Grün: Öffentliches, etwa Texte von eurer Website. Gelb: Internes wie Angebote, nur in Tools mit Firmenkonto. Rot: Daten über Kunden oder Beschäftigte,
    erst nach Rücksprache.'
  src:
  - S1
  d:
    mode: fallback
    kicker: Die Daten-Ampel
    card:
      letter: '!'
      title: Grün, Gelb, Rot
      sub: eine Einordnung, keine Vorgabe der DSK
      at: 0.2
    steps:
    - text: 'Grün: Öffentliches, z. B. Website'
      at: '@Grün'
      mark: green
    - text: 'Gelb: Internes, nur Firmenkonto'
      at: '@Gelb'
      mark: amber
    - text: 'Rot: Kunden und Beschäftigte'
      at: '@Rot'
      mark: red
    sources:
    - kind: auslegung
      label: 'Ampel: Einordnung Scutoria'
    sources_at: 1.0
- f: close
  t: sc_close
  s: Erst die Farbe, dann der Chat. Welche Farbe hätte das Zeugnis? Schreib es in die Kommentare.
  d:
    kicker: Reihe · Vor dem Upload
    rule: Erst die Farbe, dann der Chat.
    rule_at: 0.3
    question:
      text: Welche Farbe hätte es?
      at: '@Welche'
    domain: scutoria.com
    domain_at: 1.2
    claim: Belegt. Datiert. Vorzeigbar.
    disclaimer: Quellenbasiert. Keine Rechtsberatung.
