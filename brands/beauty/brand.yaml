  closing_sentence:
    de: "Dewlane erklärt Inhaltsstoffe, Kennzeichnungen und Routinen mit Quellen. Keine Produktempfehlung. Keine medizinische Beratung."
    en: "Dewlane explains ingredients, labels and routines with sources. No product recommendation. Not medical advice."
