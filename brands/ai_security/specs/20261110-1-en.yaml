id: ai_security-20261110-1-en
version: F2
title: The urgent payment request from 'the boss'
reihe: Was tust du?
short: Chef-Mail EN
note: Topic D01, EN localisation. Example case staged; mechanism and advice from S1 (Berlin Police) and S2 (FBI IC3).
description: 'An email in your boss''s name: an acquisition, a transfer abroad, today. What do you do? A staged case and the one step the police recommend.'
hashtags:
- ceofraud
- bossscam
- bookkeeping
- smallbusiness
- whatwouldyoudo
sources:
- id: S1
  url: https://www.berlin.de/polizei/aufgaben/praevention/betrug/artikel.693958.php
  title: 'Polizei Berlin: Geschäftsführer-Schwindel (CEO-Fraud)'
  checked_at: '2026-11-02'
  label: Berlin Police, CEO fraud
- id: S2
  url: https://www.ic3.gov/PSA/2024/PSA240911
  title: 'FBI IC3 PSA I-091124-PSA: Business Email Compromise (11.09.2024)'
  checked_at: '2026-11-02'
  label: FBI IC3, alert of 11 Sep 2024
unverified:
- 'Loss figures for the UK or US: not used.'
- The sequence of the example case (times, the scammer's reply, Monday's conversation) is invented and marked as an example.
pick: demonstration
hooks:
- type: question
  spoken: Your boss emails asking for an urgent transfer abroad. What do you do?
  screen: Urgent transfer. What now?
- type: misconception
  spoken: The name is right, so it's your boss? Not necessarily.
  screen: Right name = your boss?
  src:
  - S1
- type: surprising_fact
  spoken: Police say scammers get their details from company registers and websites.
  screen: Details from public records
  src:
  - S1
- type: concrete_risk
  spoken: One email in your boss's name, and the money is abroad.
  screen: Email from the boss?
  src:
  - S1
- type: demonstration
  spoken: Thursday, 4:48 p.m. An email from your boss.
  screen: THU 16:48 · Email from the boss
beats:
- f: hook
  t: sc_case
  s: 'Thursday, 4:48 p.m. An email from your boss: We''re acquiring a company. Please transfer a large sum to an account abroad, today.'
  d:
    kicker: Example case · staged
    time: THU 16:48
    place: Accounts desk, electrical firm
    mail_at: '@email'
    mail:
      from: Tom Example, MD
      addr: t.example@electrical.example
      time: '16:48'
      subject: 'Confidential: acquisition'
      lines:
      - We're acquiring a company.
      - Please make the transfer today,
      - account attached, bank abroad.
    highlight:
      line: 2
      label: abroad
      at: '@abroad'
- f: problem
  t: sc_inspect
  s: 'You take a look. The name: your boss. The topic: an acquisition, sounds plausible. The account: abroad, maybe normal for a deal like this. German police say scammers get such details from company
    registers, websites and reports.'
  src:
  - S1
  d:
    kicker: What you check
    headline: Does it sound real?
    rows:
    - label: Sender
      value: your boss's name
      verdict: looks real
      at: '@name'
    - label: Topic
      value: acquisition
      verdict: plausible
      at: '@topic'
    - label: Account
      value: bank abroad
      verdict: explainable
      at: '@account'
    finding:
      text: It all sounds plausible.
      at: '@maybe'
    fact:
      kind: fakt
      text: Scammers use company registers, websites and reports.
      source: Berlin Police · CEO fraud
      at: '@German'
- f: problem
  t: sc_choice
  s: 'What do you do? A: You pay, your boss is in a hurry. B: You reply to the email and ask. C: You call your boss on the number you know. Remember your choice.'
  src:
  - S1
  d:
    question: What do you do?
    options:
    - key: A
      text: Pay right away
      at: '@pay'
    - key: B
      text: Reply to the email
      at: '@reply'
    - key: C
      text: Call your boss on the known number
      at: '@call'
    think:
      seconds: 2.6
      at: '@Remember'
    hint: Remember your choice.
- f: demonstration
  t: sc_timeline
  s: 'Let''s play out B. Your question goes to the address in the email. So the scammer can answer: Fine, please go ahead. You pay. On Monday your boss asks what you''re talking about.'
  src:
  - S1
  d:
    kicker: Choice B, played out
    tag: Example
    headline: You ask by email
    items:
    - time: THU 16:52
      text: Your question goes out
      at: '@question'
    - time: THU 17:03
      text: 'Reply: Fine, please go ahead.'
      tone: amber
      at: '@answer'
    - time: THU 17:10
      text: You pay
      at: '@pay'
    - time: MON 08:30
      text: Your boss knows nothing
      tone: red
      at: '@Monday'
    source:
      kind: fakt
      label: Berlin Police · check the sender
      at: 1.0
- f: insight
  t: sc_step
  s: 'The right answer is C. Police advise: for unusual payments, check the sender''s address and confirm the order by calling back. Replying to the same email is no confirmation, it goes straight back
    to the sender.'
  src:
  - S1
  d:
    mode: rule
    kicker: The one step
    card:
      letter: C
      title: Call your boss back
      sub: on the number you already know
      at: 0.2
    strikes:
    - text: 'A: Pay right away'
      note: no check at all
      at: 3.0
    - text: 'B: Reply to the email'
      note: same sender
      at: '@Replying'
    sources:
    - kind: fakt
      label: Berlin Police · call back
    - kind: auslegung
      label: 'B: Scutoria''s reading'
    sources_at: '@Police'
- f: insight
  t: sc_step
  s: And if the money is already gone? Then time matters. Call your bank immediately and ask them to recall the transfer. Then report it to the police.
  src:
  - S1
  - S2
  d:
    mode: fallback
    kicker: Already paid?
    card:
      letter: '!'
      title: Time matters
      sub: act now, don't wait
      at: 0.2
    steps:
    - text: 'Bank: recall the transfer'
      at: '@bank'
    - text: Report it to the police
      at: '@report'
    sources:
    - kind: fakt
      label: Berlin Police · FBI IC3
    sources_at: '@time'
- f: close
  t: sc_close
  s: Call back first, then pay. What would you have picked? Tell me in the comments.
  d:
    kicker: Series · What would you do?
    rule: Call back first, then pay.
    rule_at: 0.3
    question:
      text: What would you have picked?
      at: '@What'
    domain: scutoria.com
    domain_at: 1.2
    claim: Sourced. Dated. Ready to show.
    disclaimer: Source-based. No legal advice.
