id: ai_security-20261112-3-en
version: F2
title: A traffic light for what goes into AI tools
reihe: Vor dem Upload
short: Daten-Ampel EN
note: Topic E06, EN localisation. No legal advice. Example case staged; statements from S1 (German data protection authorities' AI guidance) and S2 (BSI). The traffic light is Scutoria's classification.
description: A colleague wants AI to polish a job reference, names removed. Is that enough? What German data protection authorities say, and a traffic light for the team.
hashtags:
- dataprotection
- aiatwork
- gdpr
- smallbusiness
- beforeyouupload
sources:
- id: S1
  url: https://www.datenschutzkonferenz-online.de/media/oh/20240506_DSK_Orientierungshilfe_KI_und_Datenschutz.pdf
  title: 'DSK: Orientierungshilfe Künstliche Intelligenz und Datenschutz (06.05.2024)'
  checked_at: '2026-11-01'
  label: German data protection authorities (DSK), AI guidance
- id: S2
  url: https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/KI/Generative_KI-Modelle.html
  title: 'BSI: Generative KI-Modelle – Chancen und Risiken'
  checked_at: '2026-11-01'
  label: BSI, generative AI
unverified:
- The traffic light itself is Scutoria's classification, not a DSK requirement; marked as interpretation on screen.
- No legal advice on legal bases in individual cases; the DSK guidance is German, GDPR rules apply EU-wide.
- The sequence of the example case (colleague, private AI account) is invented; the job-reference example comes from S1.
pick: demonstration
hooks:
- type: question
  spoken: Can this go into the AI chat? A simple traffic light decides in seconds.
  screen: Can this go into the AI chat?
- type: misconception
  spoken: Names deleted, so it's anonymous? Often not, say German data regulators.
  screen: No names = anonymous?
  src:
  - S1
- type: surprising_fact
  spoken: Regulators say employers should provide their own accounts for work use of AI.
  screen: Work account, not private
  src:
  - S1
- type: concrete_risk
  spoken: A reference without names, and everyone still knows who it's about.
  screen: No names, still recognisable
  src:
  - S1
- type: demonstration
  spoken: Thursday, 2 p.m. A job reference is about to go into an AI chat.
  screen: THU 14:00 · A reference for the AI?
beats:
- f: hook
  t: sc_case
  s: Thursday, 2 p.m. Your colleague wants an AI to polish a job reference. She removed the names first.
  d:
    kicker: Example case · staged
    time: THU 14:00
    place: HR office of a car dealership
    mail_at: '@colleague'
    mail:
      from: AI chat (example)
      addr: private account
      time: '14:00'
      subject: Make this friendlier
      lines:
      - 'Please make this sound friendlier:'
      - sales adviser, Example Motors,
      - three years, new-car department.
    highlight:
      line: 1
      label: recognisable
      at: '@names'
- f: problem
  t: sc_inspect
  s: 'She was careful: name gone, address gone. But Germany''s data protection authorities say a person can be identified from the context. Their example: a job reference for a sales adviser at one particular
    car dealership.'
  src:
  - S1
  d:
    kicker: What you check
    headline: Is it anonymous?
    rows:
    - label: Name
      value: deleted
      verdict: done
      at: '@name'
    - label: Address
      value: deleted
      verdict: done
      at: '@address'
    - label: Context
      value: role, dealership
      verdict: recognisable
      at: '@context'
    fact:
      kind: fakt
      text: A person can be identifiable from the context.
      source: DSK · AI guidance
      at: '@example'
- f: problem
  t: sc_choice
  s: 'What do you do? A: Fine, the names are gone. B: She uses her private AI account, that''s her business. C: You first check whether this may go in at all. Remember your choice.'
  src:
  - S1
  d:
    question: What do you do?
    options:
    - key: A
      text: Fine, the names are gone
      at: '@Fine'
    - key: B
      text: Use a private AI account
      at: '@private'
    - key: C
      text: Check first, then upload
      at: '@check'
    think:
      seconds: 2.4
      at: '@Remember'
    hint: Remember your choice.
- f: insight
  t: sc_step
  s: 'The right answer is C. The authorities say: if you process personal data in AI applications, you need a legal basis for it. And employers should provide their own devices and accounts for work use
    of AI. A misses the context, B misses the work account.'
  src:
  - S1
  d:
    mode: rule
    kicker: The one step
    card:
      letter: C
      title: Check first, then upload
      sub: personal data needs a legal basis
      at: 0.2
    strikes:
    - text: 'A: The names are gone'
      note: context counts
      at: '@misses'
    - text: 'B: Private AI account'
      note: use a work account
      at: '@misses+1.6'
    sources:
    - kind: fakt
      label: DSK · legal basis
    - kind: fakt
      label: DSK · own devices and accounts
    sources_at: '@legal'
- f: benefit
  t: sc_step
  s: 'From this you can build a traffic light for the team. Green: public material, like text from your website. Amber: internal things like quotes, only in tools with a business account. Red: data about
    customers or staff, only after checking.'
  src:
  - S1
  d:
    mode: fallback
    kicker: The data traffic light
    card:
      letter: '!'
      title: Green, amber, red
      sub: a classification, not a DSK rule
      at: 0.2
    steps:
    - text: 'Green: public, e.g. website'
      at: '@Green'
      mark: green
    - text: 'Amber: internal, work account'
      at: '@Amber'
      mark: amber
    - text: 'Red: customers and staff'
      at: '@Red'
      mark: red
    sources:
    - kind: auslegung
      label: 'Traffic light: Scutoria''s reading'
    sources_at: 1.0
- f: close
  t: sc_close
  s: Colour first, then the chat. Which colour would the reference be? Tell me in the comments.
  d:
    kicker: Series · Before the upload
    rule: Colour first, then the chat.
    rule_at: 0.3
    question:
      text: Which colour would it be?
      at: '@Which'
    domain: scutoria.com
    domain_at: 1.2
    claim: Sourced. Dated. Ready to show.
    disclaimer: Source-based. No legal advice.
