id: motivation
name: Gritwerk
niche: motivation and self-development
style: cinematic_human
phase: 5
enabled: false
brand_version: "0.9"           # Vorlage Gritwerk 0.9 (2026-10-30); 1.0 only after Stefan's approval
template_doc: 'C:\Users\Stefa\OneDrive\Business\02 Marke\Gritwerk\Vorlage Gritwerk.md'
languages:
- de
- en
primary_language: de
risk_default: medium
rules:
- no psychological or medical claims; methods with named sources
- every method with a named study, textbook or institution (URL and retrieval date in the plan)
- no guru or celebrity quotes without a documented source; no invented quotes
- no promises of outcomes; findings are reported as study findings ("in the study ...")
# Palette: brands.yaml base (#121212 / #E5B45A / #F4F0E8) kept; warm neutrals added so cards and paper
# read as warm instead of grey. Colours with fixed meaning (Schnitt- und Layout-Vorlage 30.10.2026): gold = active / fact,
# amber = open (question, missed day), red = risk only, green = reached only, violet = interpretation (explainer).
palette:
  bg: '#121110'                # warm near-black (brands.yaml #121212, nudged warm)
  surface: '#1F1C19'           # cards, status bar
  surface_raised: '#2A2622'
  text: '#F4F0E8'              # warm off-white
  muted: '#A39C91'             # secondary labels
  hairline: 'rgba(244,240,232,0.14)'
  accent: '#E5B45A'            # gold: filled day boxes, highlight word, progress, mark
  accent_soft: 'rgba(229,180,90,0.16)'
  button: '#E5B45A'
  on_accent: '#17130D'
  signal_amber: '#E8873A'      # amber = open: hook stamp question, missed day box, open status states
  signal_red: '#D4553F'        # red = risk only (unused in the test video)
  signal_green: '#8FB573'      # green = reached state only
  on_signal: '#17130D'
  paper: '#F4F0E8'             # the habit card (paper)
  paper_ink: '#1B1712'
  paper_muted: '#7D746A'
  box_empty: '#DDD5C8'         # empty day box on paper
  scheme: dark
fonts:
  display:
    family: Fraunces
    weight: 700
    file: brands/motivation/assets/fonts/fraunces/Fraunces[SOFT,WONK,opsz,wght].ttf
    license: OFL-1.1
    license_file: brands/motivation/assets/fonts/fraunces/OFL.txt
    source: 'https://github.com/google/fonts/tree/main/ofl/fraunces (OFL-1.1), heruntergeladen 2026-10-30'
  body:
    family: Inter
    weight: 500
    file: assets/fonts/inter/Inter[opsz,wght].ttf
    license: OFL-1.1
    license_file: assets/fonts/inter/OFL.txt
  mono:
    family: Inter
    weight: 600
    file: assets/fonts/inter/Inter[opsz,wght].ttf
    license: OFL-1.1
    license_file: assets/fonts/inter/OFL.txt
logo:
