id: ai_security-20261112-2-en
version: F2
title: 'Quishing: the fake QR code'
reihe: Was tust du?
short: Quishing EN
note: Topic D04, EN localisation. Example case staged; mechanism and advice from S1 (German consumer centre) and S2 (FBI IC3).
description: 'There''s a QR code on the parking meter: pay by phone. What do you do? A staged case and the one step the FBI recommends when paying.'
hashtags:
- quishing
- qrcode
- scam
- smallbusiness
- whatwouldyoudo
sources:
- id: S1
  url: https://www.verbraucherzentrale.de/wissen/digitale-welt/phishingradar/quishing-falsche-qrcodes-in-mails-briefen-oepnv-und-strassenverkehr-98612
  title: 'Verbraucherzentrale: Quishing – falsche QR-Codes'
  checked_at: '2026-11-01'
  label: German consumer centre, quishing
- id: S2
  url: https://www.ic3.gov/PSA/2022/PSA220118
  title: 'FBI IC3 PSA I-011822-PSA: Cybercriminals tampering with QR codes'
  checked_at: '2026-11-01'
  label: FBI IC3, QR code alert
unverified:
- 'Case numbers for quishing: not used.'
- 'Scanner app recommendations: deliberately not given (sources disagree).'
- The sequence of the example case (fake payment page, later charges) is invented and marked as an example; the aim of the scam (stealing data or money) comes from S1.
- That reading the address alone is not enough is Scutoria's reading of S2, marked on screen.
pick: demonstration
hooks:
- type: question
  spoken: A QR code on the parking meter. Do you scan it?
  screen: Do you scan it?
- type: misconception
  spoken: A QR code on an official meter is genuine? Not necessarily.
  screen: On the meter = genuine?
  src:
  - S1
- type: surprising_fact
  spoken: Criminals stick fake QR codes over the real ones on parking meters and chargers.
  screen: Stickers over real codes
  src:
  - S1
- type: concrete_risk
  spoken: One sticker on a parking meter, and your payment goes to scammers.
  screen: One sticker, wrong account
  src:
  - S1
- type: demonstration
  spoken: Wednesday, 7:50 a.m. There's a QR code on the parking meter.
  screen: WED 07:50 · Pay by phone
beats:
- f: hook
  t: sc_case
  s: 'Wednesday, 7:50 a.m. You park outside the wholesale market. On the parking meter there''s a QR code: Pay easily by phone.'
  d:
    kicker: Example case · staged
    time: WED 07:50
    place: Shopping run for the restaurant
    mail_at: '@meter'
    mail:
      from: Parking meter (example)
      addr: Sticker with QR code
      time: 07:50
      subject: Pay easily by phone
      lines:
      - Scan the QR code,
      - enter your plate, done.
      - '[ sticker over the original ]'
    highlight:
      line: 2
      label: sticker
      at: '@easily'
- f: problem
  t: sc_inspect
  s: 'You take a look. The meter: as usual. The code: looks neat. Where it leads: you can''t tell by looking. German consumer advisers call this quishing: criminals stick their own QR codes over real ones,
    on parking meters and charging points.'
  src:
  - S1
  d:
    kicker: What you check
    headline: Looks genuine?
    rows:
    - label: Meter
      value: as usual
      verdict: looks fine
      at: '@meter'
    - label: Code
      value: neat
      verdict: looks fine
      at: '@code'
    - label: Target
      value: can't tell
      verdict: open
      at: '@leads'
    fact:
      kind: fakt
      text: Criminals cover real QR codes on meters and chargers.
      source: German consumer centre · quishing
      at: '@German'
- f: problem
  t: sc_choice
  s: 'What do you do? A: Scan and pay, it''s quick. B: Scan, but read the address first. C: Don''t pay via the code at all, open the parking app or address you know. Remember your choice.'
  src:
  - S2
  d:
    question: What do you do?
    options:
    - key: A
      text: Scan and pay
      at: '@Scan'
    - key: B
      text: Scan, read the address first
      at: '@but'
    - key: C
      text: Use the app or address you know
      at: '@Don''t'
    think:
      seconds: 2.4
      at: '@Remember'
    hint: Remember your choice.
- f: demonstration
  t: sc_timeline
  s: Let's play out A. The code opens a page that looks like the real one. You enter your card details, the page confirms, everything looks normal. Later, strangers charge your card.
  src:
  - S1
  d:
    kicker: Choice A, played out
    tag: Example
    headline: You scan and pay
    items:
    - time: WED 07:51
      text: Code scanned
      at: 0.6
    - time: WED 07:51
      text: Page looks genuine
      tone: amber
      at: '@page'
    - time: WED 07:52
      text: Card details entered
      at: '@card'
    - time: Later
      text: Strangers charge your card
      tone: red
      at: '@Later'
    source:
      kind: fakt
      label: Consumer centre · data or money
      at: 1.0
- f: insight
  t: sc_step
  s: 'The right answer is C. The FBI advises: when paying, don''t use a page from a QR code, type in an address you know instead. Reading the address helps, but fake ones often look very close to the real
    thing. And on meters, it''s worth checking whether a sticker covers the original.'
  src:
  - S2
  d:
    mode: rule
    kicker: The one step
    card:
      letter: C
      title: Use the known route
      sub: type the address, don't scan
      at: 0.2
    strikes:
    - text: 'A: Scan and pay'
      note: no check at all
      at: 3.0
    - text: 'B: Just read the address'
      note: helps, not enough
      at: '@helps'
    sources:
    - kind: fakt
      label: FBI IC3 · paying via QR codes
    - kind: auslegung
      label: 'B: Scutoria''s reading'
    sources_at: '@FBI'
- f: close
  t: sc_close
  s: Read first, then scan, then pay. What would you have picked? Tell me in the comments.
  d:
    kicker: Series · What would you do?
    rule: Read first, then pay.
    rule_at: 0.3
    question:
      text: What would you have picked?
      at: '@What'
    domain: scutoria.com
    domain_at: 1.2
    claim: Sourced. Dated. Ready to show.
    disclaimer: Source-based. No legal advice.
