id: ai_security-20261113-3-en
version: F2
title: "Myth: phishing emails are full of typos"
short: "Mythos Phishing-Fehler EN"
reihe: "Was tust du?"
note: "F2 EN (localised from the DE spec), the myth as wrong option A. Example case staged: bank, firm, person, times and sequence are invented; mechanism and steps from S1 to S4, read 02.11.2026 (S3 and S4 new). The old plan ai_security-20261113-3-en.json stays unchanged."
description: "An email from your bank, not a single mistake. What do you do? A staged case with three answers and what the NCSC, Germany's BSI and Microsoft actually advise."
hashtags: [phishing, myth, aisecurity, smallbusiness, whatwouldyoudo]
sources:
  - {id: S1, url: "https://www.ncsc.gov.uk/report/impact-of-ai-on-cyber-threat", title: "NCSC assessment: The near-term impact of AI on the cyber threat (24.01.2024)", checked_at: "2026-11-02", label: "NCSC, AI and the cyber threat"}
  - {id: S2, url: "https://www.bsi.bund.de/DE/Themen/Verbraucherinnen-und-Verbraucher/Cyber-Sicherheitslage/Methoden-der-Cyber-Kriminalitaet/Spam-Phishing-Co/Passwortdiebstahl-durch-Phishing/Wie-erkenne-ich-Phishing-in-E-Mails-und-auf-Webseiten/wie-erkenne-ich-phishing-in-e-mails-und-auf-webseiten_node.html", title: "BSI: Wie erkenne ich Phishing in E-Mails und auf Webseiten?", checked_at: "2026-11-02", label: "BSI (Germany), spotting phishing"}
  - {id: S3, url: "https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Publikationen/Broschueren/Wegweiser_Checklisten_Flyer/Checkliste_BSI_ProPK_Phishing.pdf?__blob=publicationFile&v=5", title: "BSI und Polizei (ProPK): Phishing – Checkliste für den Ernstfall (PDF)", checked_at: "2026-11-02", label: "BSI and German police, phishing checklist"}
  - {id: S4, url: "https://support.microsoft.com/en-us/windows/protect-yourself-from-tech-support-scams-2ebf91bd-f94c-2a8a-e541-f5c800d18435", title: "Microsoft Support: Protect yourself from online scams and attacks", checked_at: "2026-11-02", label: "Microsoft, online scams"}
unverified:
  - "Share of AI-written phishing: not used (no figure in the sources)."
  - "Figures from the BSI Cyber Security Monitor 2026 (28 and 19 percent) not used in this version."
  - "The sequence of the example case (Example Bank, Ms Berger, times, entering the login details) is invented and marked as an example."
  - "That replying to the email (option B) is no real check is Scutoria's interpretation of S3 (sender addresses are faked; confirm by phone using a number you look up yourself); marked as interpretation on screen."
  - "Fallback localised: the German blocking hotline 116 116 from S3 is replaced by 'call your bank', which S3 also names (contact your bank about further steps)."
  - "Newly checked 02.11.2026: S3 (institutions don't ask by email to change sensitive data via a link) and S4 (go to the site yourself from your own saved favourite or by typing the address). The page at the S4 URL is now titled 'Protect yourself from online scams and attacks'."
pick: demonstration
hooks:
  - {type: misconception, spoken: "You can spot phishing by the bad spelling? Not with AI.", screen: "Phishing = bad spelling?", src: [S1]}
  - {type: question, spoken: "How do you spot a phishing email without a single mistake?", screen: "No mistakes. Now what?"}
  - {type: surprising_fact, spoken: "Germany's BSI says typos are now rarely a clear sign of phishing.", screen: "Typos? Rarely a sign any more", src: [S2]}
  - {type: concrete_risk, spoken: "A flawless email from the bank can still be fake.", screen: "Flawless and still fake", src: [S1, S2]}
  - {type: demonstration, spoken: "Thursday, 8:55 a.m. An email from your bank, without a single mistake.", screen: "THU 08:55 · Not a single mistake", visual: "clock, the bank email arrives as a paper card, the threatening line is marked"}
beats:
  - f: hook
    t: sc_case
    s: "Thursday, 8:55 a.m. An email from your bank: Please confirm your login details today, or your account will be suspended."
    d:
      kicker: "Example case · staged"
      time: "THU 08:55"
      place: "Accounts desk, bakery"
      mail_at: "@bank"
      mail: {from: "Example Bank", addr: "service@examplebank.example", time: "08:55", subject: "Security check due", lines: ["Dear Ms Berger,", "please confirm your login details", "today, or your account is locked."]}
      highlight: {line: 2, label: "threat", at: "@today"}
  - f: problem
    t: sc_inspect
    s: "You check, as you were taught. Language: flawless. Greeting: your name. Tone: polite. Not a single mistake. But according to the NCSC, AI writes lures without the mistakes that gave phishing away."
    src: [S1]
    d:
      kicker: "What you check"
      headline: "Where's the mistake?"
      rows:
        - {label: "Language", value: "flawless", verdict: "looks fine", at: "@Language"}
        - {label: "Greeting", value: "uses your name", verdict: "looks fine", at: "@Greeting"}
        - {label: "Tone", value: "polite, matter-of-fact", verdict: "looks fine", at: "@Tone"}
      finding: {text: "Not a single mistake.", at: "@Not"}
      fact: {kind: fakt, text: "AI writes lures without the typical phishing mistakes.", source: "NCSC · assessment of 24 Jan 2024", at: "@according"}
  - f: problem
    t: sc_choice
    s: "What do you do? A: No mistakes, so it's real. You click the link. B: You reply and ask. C: You open the bank's site yourself. Remember your choice."
    src: [S2]
    d:
      question: "What do you do?"
      options:
        - {key: A, text: "No mistakes, so it's real: click", at: "@mistakes"}
        - {key: B, text: "Reply to the email and ask", at: "@reply"}
        - {key: C, text: "Go to the bank's site yourself", at: "@yourself"}
      think: {seconds: 2.6, at: "@Remember"}
      hint: "Remember your choice."
  - f: demonstration
    t: sc_timeline
    s: "Let's play out A. The link leads to a login page that looks as usual. You enter your login details. According to the BSI, criminals harvest passwords on pages like this."
    src: [S3]
    d:
      kicker: "Choice A, played out"
      tag: "Example"
      headline: "You click the link"
      items:
        - {time: "THU 08:56", text: "Login page looks as usual", at: "@login"}
        - {time: "THU 08:57", text: "Login details entered", tone: amber, at: "@enter"}
        - {time: "Afterwards", text: "Password with criminals", tone: red, at: "@harvest"}
      source: {kind: fakt, label: "BSI and police · phishing checklist", at: "@BSI"}
  - f: insight
    t: sc_step
    s: "The right answer is C. Germany's BSI says trustworthy institutions don't ask you by email to change sensitive data via a link. Microsoft advises going to the site yourself. A only checks the form. B asks the very sender in question."
    src: [S3, S4]
    d:
      mode: rule
      kicker: "The one step"
      card: {letter: C, title: "Open the bank site yourself", sub: "from your bookmark, never the link", at: 0.2}
      strikes:
        - {text: "A: No mistakes, so it's real", note: "only checks the form", at: "@only"}
        - {text: "B: Reply to the sender", note: "same sender", at: "@asks"}
      sources:
        - {kind: fakt, label: "BSI · no data changes via links"}
        - {kind: fakt, label: "Microsoft · go to the site yourself"}
        - {kind: auslegung, label: "B: Scutoria's reading"}
      sources_at: "@BSI"
  - f: insight
    t: sc_step
    s: "Already entered them? Then call your bank straight away to block access, and check your transactions with them."
    src: [S3]
    d:
      mode: fallback
      kicker: "Already entered them?"
      card: {letter: "!", title: "Block access now", sub: "don't wait", at: 0.2}
      steps:
        - {text: "Call your bank, block access", at: "@call"}
        - {text: "Check transactions with them", at: "@check"}
      sources:
        - {kind: fakt, label: "BSI and police · phishing checklist"}
      sources_at: "@straight"
  - f: close
    t: sc_close
    s: "Check the intent, not the spelling. What would you have picked? Tell me in the comments."
    d:
      kicker: "Series · What would you do?"
      rule: "Check the intent, not typos."
      rule_at: 0.3
      question: {text: "What would you have picked?", at: "@What"}
      domain: "scutoria.com"
      domain_at: 1.2
      claim: "Sourced. Dated. Ready to show."
      disclaimer: "Source-based. No legal advice."
